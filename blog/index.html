    <main class="blogs-page">
      <header class="blogs-page-head">
        <p class="section-label">Writing</p>
        <h1>All Blog Posts</h1>
        <p>
          Notes, project lessons, and practical thoughts about data science,
          machine learning, and AI.
        </p>
      </header>

      <div class="projects-controls">
        <div class="search-box">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="search"
            id="blog-search"
            placeholder="Search articles..."
            oninput="filterBlogs()"
          />
        </div>
        <div class="filter-pills" id="blog-filters">
          <button
            class="filter-pill active"
            data-cat="All"
            onclick="setBlogFilter(this)"
          >
            All
          </button>
          <button
            class="filter-pill"
            data-cat="Machine Learning"
            onclick="setBlogFilter(this)"
          >
            ML
          </button>
          <button
            class="filter-pill"
            data-cat="Data Science"
            onclick="setBlogFilter(this)"
          >
            Data Science
          </button>
          <button
            class="filter-pill"
            data-cat="Deep Learning"
            onclick="setBlogFilter(this)"
          >
            Deep Learning
          </button>
          <button
            class="filter-pill"
            data-cat="Career"
            onclick="setBlogFilter(this)"
          >
            Career
          </button>
        </div>
      </div>

      <div class="blog-grid" id="blog-grid"></div>
    </main>
